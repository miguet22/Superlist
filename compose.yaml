services:
  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      frontend2:
        condition: service_healthy
      frontend3:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
      suggestions:
        condition: service_healthy
    networks:
      - web

  frontend: &frontend
    image: superlist-web:local
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - web

  frontend2:
    <<: *frontend

  frontend3:
    <<: *frontend

  backend: &backend
    hostname: backend
    image: superlist-api:local
    build:
      context: ./backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUGGESTIONS_SERVICE_URL: "http://suggestions:8001/api/suggestions"
    depends_on:
      redis:
        condition: service_healthy
      suggestions:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert d.get('redis_connected') and d.get('redis_mode') == 'Servidor Redis (redis:6379)'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web
      - data

  backend2:
    <<: *backend
    hostname: backend2

  backend3:
    <<: *backend
    hostname: backend3

  suggestions:
    hostname: suggestions
    image: superlist-suggestions:local
    build:
      context: ./suggestions_service
    environment:
      PORT: "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - web

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

volumes:
  redis_data:

networks:
  web:
  data:
    internal: true
